name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore .NET dependencies
        run: dotnet restore GlyphLens.sln

      - name: Check C# formatting
        run: dotnet format GlyphLens.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build (Release)
        run: dotnet build GlyphLens.sln --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test GlyphLens.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Run Python worker tests
        working-directory: worker
        run: python -m unittest discover -s tests -t . -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
