[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphlens-worker"
dynamic = ["version"]
description = "Local inference worker for GlyphLens: OCR, language identification and offline translation."
readme = "README.md"
requires-python = ">=3.11"
# Intentionally empty for Phase 0. PaddleOCR and Argos Translate are deferred until their
# combined Windows wheel compatibility is validated (see docs/decisions/ADR-0004-worker-communication.md).
dependencies = []
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
glyphlens-worker = "glyphlens_worker.main:main"

[tool.setuptools.dynamic]
version = { attr = "glyphlens_worker.__version__" }

[tool.setuptools.packages.find]
include = ["glyphlens_worker*"]
